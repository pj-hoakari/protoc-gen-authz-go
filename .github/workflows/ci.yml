name: Check authz schema version bump

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check authz schema version bump
        run: |
          HEAD_REF=$(git rev-parse "${GITHUB_SHA}^{}")
          BASE_REF=$(git describe --tags --abbrev=0 "${HEAD_REF}^" 2>/dev/null || true)
          if [[ -z "$BASE_REF" ]]; then
            exit 0
          fi
          bash .github/scripts/check-authz-proto-version.sh "$BASE_REF" "$HEAD_REF"
