name: Check authz schema version bump

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Check authz schema version bump
        run: |
          HEAD_REF=$(git rev-parse "${GITHUB_SHA}^{}")
          BASE_REF=$(git describe --tags --abbrev=0 "${HEAD_REF}^" 2>/dev/null || true)
          if [[ -z "$BASE_REF" ]]; then
            exit 0
          fi
          bash .github/scripts/check-authz-proto-version.sh "$BASE_REF" "$HEAD_REF"
