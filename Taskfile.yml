version: '3'

tasks:
  proto:
    cmds:
      - task: proto:lint
      - task: proto:gen:go
  proto:lint:
    cmds:
      - buf lint

  proto:breaking:
    cmds:
      - |
        set -euo pipefail

        SEMVER='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        LATEST="$(git tag --list 'v*' | grep -E "$SEMVER" \
          | sed 's/-/~/' | sort -V | tail -n 1 | sed 's/~/-/' || true)"
        if [ -z "$LATEST" ]; then
          echo "リリース済みのタグがないため比較をスキップします"
          exit 0
        fi

        echo "buf breaking against ${LATEST}"
        buf breaking --against ".git#tag=${LATEST}"

  proto:gen:go:
    cmds:
      - buf generate
